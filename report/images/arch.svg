<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b8c"/>
    </marker>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4ff"/><stop offset="1" stop-color="#dfe9fb"/>
    </linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eefaf2"/><stop offset="1" stop-color="#ddf0e4"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3eeff"/><stop offset="1" stop-color="#e7dcfb"/>
    </linearGradient>
    <linearGradient id="store" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4e6"/><stop offset="1" stop-color="#fbe6c8"/>
    </linearGradient>
    <linearGradient id="llm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeef0"/><stop offset="1" stop-color="#fbdde2"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="920" height="600" fill="#ffffff"/>

  <!-- 前端层 -->
  <rect x="24" y="20" width="872" height="96" rx="10" fill="#ffffff" stroke="#c8d6ee" stroke-width="1.5"/>
  <text x="44" y="46" font-size="14" font-weight="bold" fill="#3b5b8c">前端展示层（原生 HTML / CSS / JS 单页应用）</text>
  <g>
    <rect x="44" y="60" width="180" height="42" rx="8" fill="url(#front)" stroke="#9db8e0"/>
    <text x="134" y="86" font-size="13" text-anchor="middle" fill="#2c4a75">智能搜索（多轮对话）</text>
    <rect x="244" y="60" width="160" height="42" rx="8" fill="url(#front)" stroke="#9db8e0"/>
    <text x="324" y="86" font-size="13" text-anchor="middle" fill="#2c4a75">知识库（文档管理）</text>
    <rect x="424" y="60" width="160" height="42" rx="8" fill="url(#front)" stroke="#9db8e0"/>
    <text x="504" y="86" font-size="13" text-anchor="middle" fill="#2c4a75">调研报告（生成/下载）</text>
    <rect x="604" y="60" width="160" height="42" rx="8" fill="url(#front)" stroke="#9db8e0"/>
    <text x="684" y="86" font-size="13" text-anchor="middle" fill="#2c4a75">运营看板（指标）</text>
  </g>

  <line x1="460" y1="116" x2="460" y2="150" stroke="#5b6b8c" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- API 层 -->
  <rect x="24" y="152" width="872" height="74" rx="10" fill="#ffffff" stroke="#bcd9c4" stroke-width="1.5"/>
  <text x="44" y="178" font-size="14" font-weight="bold" fill="#2f6b43">API 网关层（FastAPI + Uvicorn + SSE）</text>
  <g>
    <rect x="44" y="190" width="180" height="26" rx="6" fill="url(#api)" stroke="#7fbf93"/>
    <text x="134" y="207" font-size="12" text-anchor="middle" fill="#235c37">/api/documents</text>
    <rect x="244" y="190" width="160" height="26" rx="6" fill="url(#api)" stroke="#7fbf93"/>
    <text x="324" y="207" font-size="12" text-anchor="middle" fill="#235c37">/api/search</text>
    <rect x="424" y="190" width="160" height="26" rx="6" fill="url(#api)" stroke="#7fbf93"/>
    <text x="504" y="207" font-size="12" text-anchor="middle" fill="#235c37">/api/reports</text>
    <rect x="604" y="190" width="160" height="26" rx="6" fill="url(#api)" stroke="#7fbf93"/>
    <text x="684" y="207" font-size="12" text-anchor="middle" fill="#235c37">/api/dashboard</text>
  </g>

  <line x1="460" y1="226" x2="460" y2="260" stroke="#5b6b8c" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 核心层 -->
  <rect x="24" y="262" width="872" height="180" rx="10" fill="#ffffff" stroke="#cdbdee" stroke-width="1.5"/>
  <text x="44" y="288" font-size="14" font-weight="bold" fill="#5a3b9b">Agentic RAG 核心层（LangGraph 编排）</text>

  <!-- LangGraph 编排图 -->
  <rect x="44" y="300" width="540" height="130" rx="8" fill="url(#core)" stroke="#b39de0"/>
  <text x="314" y="320" font-size="12" fill="#5a3b9b" text-anchor="middle" font-weight="bold">多步 Agent 编排（有向图，含 Critic 回环）</text>
  <g font-size="12">
    <rect x="64" y="334" width="104" height="40" rx="8" fill="#ffffff" stroke="#8e6fd0"/>
    <text x="116" y="350" text-anchor="middle" fill="#4a2f85">Planner</text>
    <text x="116" y="366" text-anchor="middle" font-size="10" fill="#6b5a94">问题分解</text>
    <rect x="198" y="334" width="104" height="40" rx="8" fill="#ffffff" stroke="#8e6fd0"/>
    <text x="250" y="350" text-anchor="middle" fill="#4a2f85">Retrieval</text>
    <text x="250" y="366" text-anchor="middle" font-size="10" fill="#6b5a94">混合检索</text>
    <rect x="332" y="334" width="104" height="40" rx="8" fill="#ffffff" stroke="#8e6fd0"/>
    <text x="384" y="350" text-anchor="middle" fill="#4a2f85">Critic</text>
    <text x="384" y="366" text-anchor="middle" font-size="10" fill="#6b5a94">充分性审查</text>
    <rect x="466" y="334" width="108" height="40" rx="8" fill="#ffffff" stroke="#8e6fd0"/>
    <text x="520" y="350" text-anchor="middle" fill="#4a2f85">Synthesizer</text>
    <text x="520" y="366" text-anchor="middle" font-size="10" fill="#6b5a94">综合生成</text>
  </g>
  <g font-size="11" fill="#5b6b8c">
    <text x="170" y="356" text-anchor="middle">→</text>
    <text x="304" y="356" text-anchor="middle">→</text>
    <text x="438" y="356" text-anchor="middle">→</text>
  </g>
  <!-- 回环箭头 -->
  <path d="M384 374 L384 410 L250 410 L250 376" fill="none" stroke="#c0563b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="317" y="406" font-size="10" fill="#c0563b" text-anchor="middle">信息不足 → 补充检索（≤3 轮）</text>

  <!-- 右侧组件 -->
  <rect x="604" y="300" width="272" height="62" rx="8" fill="url(#core)" stroke="#b39de0"/>
  <text x="740" y="322" font-size="12" font-weight="bold" text-anchor="middle" fill="#5a3b9b">HybridRetriever 混合检索</text>
  <text x="740" y="342" font-size="11" text-anchor="middle" fill="#4a2f85">BM25 + 向量 + RRF 融合 + Reranker</text>

  <rect x="604" y="372" width="272" height="58" rx="8" fill="url(#core)" stroke="#b39de0"/>
  <text x="740" y="394" font-size="12" font-weight="bold" text-anchor="middle" fill="#5a3b9b">BGE 模型本地推理</text>
  <text x="740" y="414" font-size="11" text-anchor="middle" fill="#4a2f85">bge-large-zh-v1.5 / bge-reranker-base</text>

  <line x1="460" y1="442" x2="460" y2="478" stroke="#5b6b8c" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 存储层 + LLM -->
  <rect x="24" y="480" width="560" height="100" rx="10" fill="#ffffff" stroke="#e4c08a" stroke-width="1.5"/>
  <text x="44" y="506" font-size="14" font-weight="bold" fill="#9a5f12">数据存储层</text>
  <rect x="44" y="518" width="250" height="50" rx="8" fill="url(#store)" stroke="#d8a95c"/>
  <text x="169" y="540" font-size="13" font-weight="bold" text-anchor="middle" fill="#7a4c0a">PostgreSQL + pgvector</text>
  <text x="169" y="558" font-size="11" text-anchor="middle" fill="#8a5f1c">文档 / 分片向量(HNSW) / 日志 / 报告</text>
  <rect x="314" y="518" width="250" height="50" rx="8" fill="url(#store)" stroke="#d8a95c"/>
  <text x="439" y="540" font-size="13" font-weight="bold" text-anchor="middle" fill="#7a4c0a">Redis</text>
  <text x="439" y="558" font-size="11" text-anchor="middle" fill="#8a5f1c">BM25 索引缓存 / 会话状态</text>

  <rect x="604" y="480" width="292" height="100" rx="10" fill="#ffffff" stroke="#e2a5b0" stroke-width="1.5"/>
  <text x="624" y="506" font-size="14" font-weight="bold" fill="#9b2c3d">大语言模型</text>
  <rect x="624" y="518" width="252" height="50" rx="8" fill="url(#llm)" stroke="#d97a88"/>
  <text x="750" y="540" font-size="13" font-weight="bold" text-anchor="middle" fill="#7a1f2c">DeepSeek Chat</text>
  <text x="750" y="558" font-size="11" text-anchor="middle" fill="#8a2c3a">OpenAI 兼容 API（可替换）</text>

  <!-- 虚线连接：核心检索到存储/LLM -->
  <line x1="340" y1="442" x2="169" y2="518" stroke="#c0563b" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <line x1="620" y1="372" x2="439" y2="518" stroke="#c0563b" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <line x1="740" y1="372" x2="750" y2="518" stroke="#c0563b" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
</svg>
